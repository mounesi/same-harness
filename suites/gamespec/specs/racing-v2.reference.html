<!DOCTYPE html>
<!--
  racing-v2 REFERENCE IMPLEMENTATION — not a submission, not a target to imitate.

  Same purpose as racing-v1.reference.html: prove the spec is implementable and unambiguous,
  and give floor_check.py --spec racing-v2 something that passes. Every place this file had
  to guess was pushed back into racing-v2.md before any model saw it.

  Deliberately ugly: flat-shaded polygons, no textures, no sound. The 3D view is a software
  pinhole projection onto a 2D canvas (View.project), drawn painter's-order, because that is
  the least that satisfies "presented in 3D" — the human channel differentiates on the rest.
-->
<html lang="en">
<head><meta charset="utf-8"><title>racing-v2 reference</title>
<style>
  body { margin:0; background:#111; color:#ddd; font:14px system-ui, sans-serif; }
  canvas { display:block; margin:12px auto; background:#1a1a1a; border:1px solid #333; }
  #hud { text-align:center; }
</style></head>
<body>
<div id="hud">arrows / WASD drive, shift or space = boost — reference implementation, deliberately plain</div>
<canvas id="c" width="960" height="600"></canvas>
<script>
'use strict';
// ---------------------------------------------------------------------------------------
// SimCore — pure. No DOM, no Math.random, no clock. See racing-v2.md §2.
// ---------------------------------------------------------------------------------------
(function () {
  var ACCEL = 220.0, BRAKE = 400.0, DRAG = 0.9, TURN_RATE = 2.6, MAX_SPEED = 320.0;
  var OFFROAD_ACCEL = 0.5, OFFROAD_DRAG = 0.35;
  var BOOST_MULT = 1.8, BOOST_MAX = 400.0, BOOST_DURATION = 2.0, BOOST_RECHARGE = 8.0;

  // mulberry32 — a tiny seeded PRNG; the ONLY source of randomness in the core.
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  function segDist2(px, py, ax, ay, bx, by) {
    var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    var t = l2 > 0 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
    t = clamp(t, 0, 1);
    var cx = ax + t * dx, cy = ay + t * dy;
    return (px - cx) * (px - cx) + (py - cy) * (py - cy);
  }
  function onRoad(track, x, y) {
    var cl = track.centerline, best = Infinity;
    for (var i = 0; i < cl.length; i++) {
      var a = cl[i], b = cl[(i + 1) % cl.length];       // closed loop: last -> first
      var d = segDist2(x, y, a.x, a.y, b.x, b.y);
      if (d < best) best = d;
    }
    var half = track.roadWidth / 2;
    return best <= half * half;
  }

  function copyCar(c) {
    return {x: c.x, y: c.y, heading: c.heading, speed: c.speed,
            lap: c.lap, nextCheckpoint: c.nextCheckpoint, skill: c.skill};
  }
  function clone(s) {
    var p = s.player;
    return {
      seed: s.seed, laps: s.laps, t: s.t, finished: s.finished,
      lap: s.lap, nextCheckpoint: s.nextCheckpoint, lapStart: s.lapStart,
      lapTimes: s.lapTimes.slice(), bestLap: s.bestLap,
      player: {x: p.x, y: p.y, heading: p.heading, speed: p.speed,
               boostCharge: p.boostCharge, boostActive: p.boostActive},
      opponents: s.opponents.map(copyCar),
      ranking: s.ranking.slice(),
      track: s.track,                                     // immutable; shared on purpose
    };
  }

  function create(config) {
    var tr = config.track;
    var track = {
      width: tr.width, height: tr.height, roadWidth: tr.roadWidth,
      centerline: tr.centerline.map(function (p) { return {x: p.x, y: p.y}; }),
      checkpoints: tr.checkpoints.map(function (c) { return {x: c.x, y: c.y, r: c.r}; }),
    };
    var cps = track.checkpoints, start = cps[0], aim = cps[1 % cps.length];
    var heading = Math.atan2(aim.y - start.y, aim.x - start.x);
    var rnd = mulberry32(config.seed >>> 0), opps = [];
    for (var i = 0; i < (config.opponents | 0); i++) {
      opps.push({x: start.x, y: start.y, heading: heading, speed: 0, lap: 0,
                 nextCheckpoint: 1, skill: 0.7 + 0.3 * rnd()});   // seeded per-opponent skill
    }
    var s = {
      seed: config.seed >>> 0, laps: config.laps | 0, t: 0, finished: false,
      lap: 0, nextCheckpoint: 1, lapStart: 0, lapTimes: [], bestLap: null,
      player: {x: start.x, y: start.y, heading: heading, speed: 0, boostCharge: 1, boostActive: 0},
      opponents: opps, ranking: [], track: track,
    };
    s.ranking = rank(s);
    return s;
  }

  // Rules 4-10 of §2.2, shared by the player and every opponent.
  function drive(car, input, dt, track, road, boosting) {
    var thr = clamp(input.throttle || 0, 0, 1), brk = clamp(input.brake || 0, 0, 1);
    var str = clamp(input.steer || 0, -1, 1);
    var accel = ACCEL * (road ? 1 : OFFROAD_ACCEL) * (boosting ? BOOST_MULT : 1);
    var drag = road ? DRAG : OFFROAD_DRAG, maxSpeed = boosting ? BOOST_MAX : MAX_SPEED;
    car.speed += (accel * thr - BRAKE * brk) * dt;          // 5
    car.speed *= Math.pow(drag, dt);                        // 6
    if (car.speed < 0) car.speed = 0;                       // 7
    if (car.speed > maxSpeed) car.speed = maxSpeed;
    car.heading += str * TURN_RATE * Math.min(1, car.speed / 60) * dt;   // 8
    car.x += Math.cos(car.heading) * car.speed * dt;        // 9
    car.y += Math.sin(car.heading) * car.speed * dt;
    var hit = false;                                        // 10
    if (car.x < 0) { car.x = 0; hit = true; } else if (car.x > track.width) { car.x = track.width; hit = true; }
    if (car.y < 0) { car.y = 0; hit = true; } else if (car.y > track.height) { car.y = track.height; hit = true; }
    if (hit) car.speed = 0;
  }
  // §2.3 for one car; returns true when a lap was completed.
  function checkpoint(car, cps) {
    var tgt = cps[car.nextCheckpoint], dx = car.x - tgt.x, dy = car.y - tgt.y;
    if (dx * dx + dy * dy <= tgt.r * tgt.r) {
      car.nextCheckpoint = (car.nextCheckpoint + 1) % cps.length;
      if (car.nextCheckpoint === 0) { car.lap += 1; return true; }
    }
    return false;
  }
  // The opponent controller: a pure function of (state, index). Aim at the next
  // checkpoint; throttle scaled by the seeded skill. Nothing clever — it only has to be
  // deterministic and competent enough to lap the standard track.
  function controller(s, i) {
    var o = s.opponents[i], tgt = s.track.checkpoints[o.nextCheckpoint];
    var want = Math.atan2(tgt.y - o.y, tgt.x - o.x), diff = want - o.heading;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    return {throttle: (Math.abs(diff) < 0.8 ? 1 : 0.4) * o.skill, brake: 0,
            steer: clamp(diff * 2, -1, 1), boost: 0};
  }
  // §2.4
  function rank(s) {
    var cps = s.track.checkpoints, n = cps.length, cars = [];
    cars.push({id: 'player', x: s.player.x, y: s.player.y, lap: s.lap, nc: s.nextCheckpoint, idx: -1});
    for (var i = 0; i < s.opponents.length; i++) {
      var o = s.opponents[i];
      cars.push({id: 'opp' + i, x: o.x, y: o.y, lap: o.lap, nc: o.nextCheckpoint, idx: i});
    }
    for (var k = 0; k < cars.length; k++) {
      var c = cars[k], t = cps[c.nc];
      c.passed = (c.nc - 1 + n) % n;
      c.dist = Math.sqrt((c.x - t.x) * (c.x - t.x) + (c.y - t.y) * (c.y - t.y));
    }
    cars.sort(function (a, b) {
      return (b.lap - a.lap) || (b.passed - a.passed) || (a.dist - b.dist) || (a.idx - b.idx);
    });
    return cars.map(function (c) { return c.id; });
  }

  function step(state, input, dt) {
    if (state.finished) return clone(state);               // frozen
    var s = clone(state), p = s.player, track = s.track, cps = track.checkpoints;
    s.t += dt;                                              // 1
    var road = onRoad(track, p.x, p.y);                     // 2 — position BEFORE the step
    if ((input.boost | 0) === 1 && p.boostActive === 0 && p.boostCharge >= 1) {   // 3
      p.boostActive = BOOST_DURATION; p.boostCharge = 0;
    }
    var boosting = p.boostActive > 0;
    drive(p, input, dt, track, road, boosting);             // 4-10
    if (boosting) p.boostActive = Math.max(0, p.boostActive - dt);                // 11
    else p.boostCharge = Math.min(1, p.boostCharge + dt / BOOST_RECHARGE);
    var pv = {x: p.x, y: p.y, nextCheckpoint: s.nextCheckpoint, lap: s.lap};      // 12
    if (checkpoint(pv, cps)) {
      s.lapTimes.push(s.t - s.lapStart);
      s.bestLap = Math.min.apply(null, s.lapTimes);
      s.lapStart = s.t;
      if (pv.lap >= s.laps) s.finished = true;
    }
    s.nextCheckpoint = pv.nextCheckpoint; s.lap = pv.lap;
    for (var i = 0; i < s.opponents.length; i++) {
      var o = s.opponents[i], inp = controller(state, i);   // controller reads the OLD state
      drive(o, inp, dt, track, onRoad(track, o.x, o.y), false);
      checkpoint(o, cps);
    }
    s.ranking = rank(s);
    return s;
  }

  function hash(state) {
    function norm(v) {
      if (typeof v === 'number') return Math.round(v * 1e6) / 1e6;
      if (Array.isArray(v)) return v.map(norm);
      if (v && typeof v === 'object') {
        var out = {}, keys = Object.keys(v).sort();
        for (var i = 0; i < keys.length; i++) out[keys[i]] = norm(v[keys[i]]);
        return out;
      }
      return v;
    }
    var text = JSON.stringify(norm(state));
    var h1 = 0x811c9dc5, h2 = 0x01000193;
    for (var i = 0; i < text.length; i++) {
      h1 ^= text.charCodeAt(i); h1 = Math.imul(h1, 0x01000193) >>> 0;
      h2 = (h2 + text.charCodeAt(i) * (i + 1)) >>> 0; h2 = Math.imul(h2, 0x85ebca6b) >>> 0;
    }
    return ('00000000' + h1.toString(16)).slice(-8) + ('00000000' + h2.toString(16)).slice(-8);
  }

  globalThis.SimCore = {create: create, step: step, hash: hash};
})();

// ---------------------------------------------------------------------------------------
// View — pure pinhole projection. See racing-v2.md §3.
// ---------------------------------------------------------------------------------------
(function () {
  function project(pt, cam) {
    var dx = pt.x - cam.x, dy = pt.y - cam.y, dz = (pt.z || 0) - cam.z;
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    var f = dx * cy + dy * sy;            // along the viewing direction in the plane
    var r = -dx * sy + dy * cy;           // right-hand side = yaw + pi/2, like steer = +1
    var cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
    var depth = f * cp + dz * sp;         // along the (pitched) viewing axis
    var up = -f * sp + dz * cp;
    if (depth <= 1e-9) return {sx: cam.width / 2, sy: cam.height / 2, depth: depth};
    var focal = (cam.height / 2) / Math.tan(cam.fov / 2);
    return {sx: cam.width / 2 + r * focal / depth, sy: cam.height / 2 - up * focal / depth, depth: depth};
  }
  globalThis.View = {project: project};
})();

// ---------------------------------------------------------------------------------------
// Rendering + input. Free to use the DOM, timers, anything — it is never graded.
// ---------------------------------------------------------------------------------------
(function () {
  if (typeof document === 'undefined' || !document.getElementById) return;
  var canvas = document.getElementById('c');
  if (!canvas || !canvas.getContext) return;
  // Fixed viewport, not read back from the canvas: under floor_check's permissive stubs
  // canvas.width is a Proxy, and arithmetic on it throws at load time.
  var W = 960, H = 600, ctx = canvas.getContext('2d');
  canvas.width = W; canvas.height = H;
  var CFG = {seed: 7, laps: 3, opponents: 2, track: {
    width: 1000, height: 800, roadWidth: 120,
    centerline: [{x: 150, y: 150}, {x: 850, y: 150}, {x: 850, y: 650}, {x: 150, y: 650}],
    checkpoints: [{x: 150, y: 400, r: 40}, {x: 500, y: 150, r: 40},
                  {x: 850, y: 400, r: 40}, {x: 500, y: 650, r: 40}]}};
  var state = SimCore.create(CFG), keys = {};
  addEventListener('keydown', function (e) { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
  addEventListener('keyup', function (e) { keys[e.key] = false; });

  function input() {
    var up = keys.ArrowUp || keys.w, down = keys.ArrowDown || keys.s;
    var left = keys.ArrowLeft || keys.a, right = keys.ArrowRight || keys.d;
    return {throttle: up ? 1 : 0, brake: down ? 1 : 0,
            steer: (right ? 1 : 0) - (left ? 1 : 0),
            boost: (keys.Shift || keys[' ']) ? 1 : 0};
  }

  // Road pieces are built once: quads along each centerline segment, ~25 units long.
  var track = CFG.track, half = track.roadWidth / 2, pieces = [];
  (function () {
    var cl = track.centerline;
    for (var i = 0; i < cl.length; i++) {
      var a = cl[i], b = cl[(i + 1) % cl.length], dx = b.x - a.x, dy = b.y - a.y;
      var len = Math.sqrt(dx * dx + dy * dy), nx = -dy / len * half, ny = dx / len * half;
      var n = Math.max(1, Math.round(len / 25));
      for (var k = 0; k < n; k++) {
        var t0 = k / n, t1 = (k + 1) / n;
        var p0 = {x: a.x + dx * t0, y: a.y + dy * t0}, p1 = {x: a.x + dx * t1, y: a.y + dy * t1};
        pieces.push({dark: (k % 2) === 0, pts: [
          {x: p0.x + nx, y: p0.y + ny, z: 0}, {x: p1.x + nx, y: p1.y + ny, z: 0},
          {x: p1.x - nx, y: p1.y - ny, z: 0}, {x: p0.x - nx, y: p0.y - ny, z: 0}]});
      }
    }
  })();

  function carPolys(car, color) {
    var c = Math.cos(car.heading), s = Math.sin(car.heading), out = [];
    function at(l, w, z) { return {x: car.x + c * l - s * w, y: car.y + s * l + c * w, z: z}; }
    out.push({color: color, pts: [at(-10, -6, 0), at(10, -6, 0), at(10, 6, 0), at(-10, 6, 0)]});
    out.push({color: color, pts: [at(-6, -5, 9), at(5, -5, 9), at(5, 5, 9), at(-6, 5, 9)]});
    out.push({color: '#222', pts: [at(-10, -6, 0), at(10, -6, 0), at(10, -6, 5), at(-10, -6, 5)]});
    out.push({color: '#222', pts: [at(-10, 6, 0), at(10, 6, 0), at(10, 6, 5), at(-10, 6, 5)]});
    return out;
  }

  function frame() {
    state = SimCore.step(state, input(), 1 / 60);
    var p = state.player;
    var cam = {x: p.x - Math.cos(p.heading) * 150, y: p.y - Math.sin(p.heading) * 150, z: 70,
               yaw: p.heading, pitch: -0.32, fov: 1.15, width: W, height: H};
    // sky / ground split at the horizon (a far point at camera height)
    var hz = View.project({x: cam.x + Math.cos(cam.yaw) * 1e6, y: cam.y + Math.sin(cam.yaw) * 1e6, z: cam.z}, cam).sy;
    ctx.fillStyle = '#25304a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2d4a2a'; ctx.fillRect(0, hz, W, H - hz);

    var polys = [];
    for (var i = 0; i < pieces.length; i++) polys.push({color: pieces[i].dark ? '#4a4a4a' : '#555', pts: pieces[i].pts});
    var cps = track.checkpoints;
    for (var j = 0; j < cps.length; j++) {           // a checkpoint is a gate of two posts
      var cpj = cps[j], color = (j === state.nextCheckpoint) ? '#6f6' : '#aa4';
      for (var side = -1; side <= 1; side += 2) {
        var gx = cpj.x, gy = cpj.y + side * cpj.r;
        if (j === 0 || j === 2) { gx = cpj.x; gy = cpj.y + side * cpj.r; } else { gx = cpj.x + side * cpj.r; gy = cpj.y; }
        polys.push({color: color, pts: [{x: gx - 3, y: gy - 3, z: 0}, {x: gx + 3, y: gy + 3, z: 0},
                                        {x: gx + 3, y: gy + 3, z: 40}, {x: gx - 3, y: gy - 3, z: 40}]});
      }
    }
    for (var o = 0; o < state.opponents.length; o++) polys = polys.concat(carPolys(state.opponents[o], '#48e'));
    polys = polys.concat(carPolys(p, '#e44'));

    var drawn = [];
    for (var q = 0; q < polys.length; q++) {
      var pr = polys[q].pts.map(function (pt) { return View.project(pt, cam); }), ok = true, d = 0;
      for (var k = 0; k < pr.length; k++) { if (!(pr[k].depth > 1)) ok = false; d += pr[k].depth; }
      if (ok) drawn.push({color: polys[q].color, pr: pr, d: d / pr.length});
    }
    drawn.sort(function (a, b) { return b.d - a.d; });   // painter's order, far to near
    for (var m = 0; m < drawn.length; m++) {
      var dp = drawn[m];
      ctx.beginPath(); ctx.moveTo(dp.pr[0].sx, dp.pr[0].sy);
      for (var n = 1; n < dp.pr.length; n++) ctx.lineTo(dp.pr[n].sx, dp.pr[n].sy);
      ctx.closePath(); ctx.fillStyle = dp.color; ctx.fill();
    }

    // HUD
    var pos = state.ranking.indexOf('player') + 1;
    ctx.fillStyle = '#eee'; ctx.font = '14px system-ui, sans-serif';
    ctx.fillText('lap ' + state.lap + '/' + state.laps + '   pos ' + pos + '/' + state.ranking.length +
                 '   time ' + state.t.toFixed(1) + 's   best ' + (state.bestLap === null ? '-' : state.bestLap.toFixed(2) + 's') +
                 '   speed ' + p.speed.toFixed(0) + (p.boostActive > 0 ? '  BOOST' : ''), 10, 20);
    ctx.fillStyle = '#333'; ctx.fillRect(10, 30, 120, 8);
    ctx.fillStyle = p.boostActive > 0 ? '#fc3' : '#3af'; ctx.fillRect(10, 30, 120 * p.boostCharge, 8);
    if (state.finished) { ctx.font = '32px system-ui, sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('FINISHED — position ' + pos, W / 2 - 150, H / 2); }

    // minimap
    var mx = W - 130, my = 10, sc = 0.12;
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(mx - 4, my - 4, 1000 * sc + 8, 800 * sc + 8);
    ctx.strokeStyle = '#888'; ctx.lineWidth = track.roadWidth * sc; ctx.beginPath();
    var cl = track.centerline;
    for (var v = 0; v <= cl.length; v++) { var cv = cl[v % cl.length]; if (v === 0) ctx.moveTo(mx + cv.x * sc, my + cv.y * sc); else ctx.lineTo(mx + cv.x * sc, my + cv.y * sc); }
    ctx.stroke(); ctx.lineWidth = 1;
    for (var w = 0; w < state.opponents.length; w++) { ctx.fillStyle = '#48e'; ctx.fillRect(mx + state.opponents[w].x * sc - 2, my + state.opponents[w].y * sc - 2, 4, 4); }
    ctx.fillStyle = '#e44'; ctx.fillRect(mx + p.x * sc - 2, my + p.y * sc - 2, 4, 4);

    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
