# Cheap checks on every push: syntax, imports, the leakage guard, and a full end-to-end
# smoke run against a mock endpoint. No GPU, no credit, ~1 minute.
#
# This is the regression net for the class of bug that hurts most here: the pipeline breaks
# in a way no syntax check can see, and you find out on a $54/hr node after the weights
# have downloaded. If this job is green, the harness is wired.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python3, not python: the agenttask grader shells out to `python3 -m pytest`
      # (adapters/agenttask.py GRADER_PYTHON), so pytest must land in THAT interpreter.
      # They coincide under setup-python, but installing into the one that does not grade
      # is exactly the class of mismatch AI-3155 was about.
      - name: Install (pytest is the agenttask grader)
        run: python3 -m pip install --quiet pytest

      - name: Shell syntax
        shell: bash
        run: |
          # Every file is checked and ANY failure fails the step. (The previous
          # `bash -n "$f" && echo ok` form was exempt from -e and reported only the last
          # iteration's status, so a syntax error anywhere but the last file passed green.)
          fail=0
          for f in modelctl lambdactl resultsctl gpuctl gpuwatch gpu-lease \
                   harness/run.sh training/train_lora.sh smoke/run-smoke.sh \
                   $(find . -name '*.sh' -not -path './.git/*' | sort); do
            if bash -n "$f"; then echo "ok $f"; else echo "SYNTAX ERROR: $f" >&2; fail=1; fi
          done
          exit "$fail"

      - name: Python compiles
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile
          echo ok

      - name: Adapters import cleanly
        run: |
          python -c "
          import harness.adapters as A
          assert not A.IMPORT_ERRORS, A.IMPORT_ERRORS
          print('adapters:', sorted(A.ADAPTERS))"

      # AI-3155 regression guard. The defect was preflight and the grader disagreeing about
      # which interpreter runs the hidden tests: preflight probed sys.executable, the grader
      # shelled out to a hardcoded `python`. Preflight passed, then every attempt died
      # rc=127 at grade time — on a rented GPU, after the agent loop had already run.
      # Asserting the two agree is cheap; rediscovering it at $3.29/hr is not.
      - name: Grader interpreter is the one preflight probes
        run: |
          python3 -c "
          from harness.adapters import agenttask as a
          head = a.DEFAULT_TEST_CMD.split()[0]
          assert head == a.GRADER_PYTHON, (
              'DEFAULT_TEST_CMD invokes %r but GRADER_PYTHON is %r' % (head, a.GRADER_PYTHON))
          names = [n for n, _, _ in a.grading_requirements()]
          assert any(a.GRADER_PYTHON in n for n in names), (
              'grading_requirements() does not check %r: %s' % (a.GRADER_PYTHON, names))
          assert a._pytest_version() is not None, 'pytest not runnable as %s -m pytest' % a.GRADER_PYTHON
          print('grader interpreter:', a.GRADER_PYTHON, '/', a._grader_python_version())"

      # JVM suites grade from Surefire/Gradle XML rather than build stdout. The parser
      # has to survive reports Surefire genuinely emits: illegal XML control bytes inside
      # stack traces, and truncated files from killed forks. Raising on those would turn
      # a slow build into what reads as a model failure.
      - name: JUnit report parser self-test
        run: python3 -m harness.adapters._junit --self-test

      # A run's numbers are only comparable to another's if the same engine produced them.
      # Every serving-stack field was recorded by manifest.py and compared by nothing, so
      # mixing two vLLM versions — or FP8 weights with BF16 — aggregated silently into one
      # headline number. Assert the guard actually refuses each case.
      - name: Serving stack is a comparability constant
        run: |
          python3 -c "
          import sys; sys.path.insert(0, 'analysis')
          import aggregate as A
          def mk(vllm, driver, quant):
              return {'run_id': 'r', 'manifest': {
                  'harness': {'version':'1','prompt_dir_sha256':'x','prompt_template_id':'t',
                              'agent_config_sha256':'y','adapters_dir_sha256':'z','result_schema':'s'},
                  'inference': {'temperature':0.0,'top_p':1.0,'top_k':-1,'seed':1,'max_iters':40,
                                'max_tokens':1,'max_attempt_tokens':1,'task_timeout_s':1800,
                                'concurrency':4,'passes':3},
                  'runtime': {'max_model_len':262144,'extra_args':'','vllm_version':vllm,
                              'nvidia_driver':driver,'torch_version':'t','cuda_runtime':'c',
                              'transformers_version':'tr','requirements_lock_sha256':'l'},
                  'model': {'quantization':quant}, 'suite': {'name':'swebench-verified'}}}
          class Args: allow_mixed=False; strict=False
          class Diag:
              def __getattr__(self, n): return lambda *a, **k: None
          def blocking(runs):
              rep = A.comparability_report(runs, Args(), Diag())
              return sorted(f['field'] for f in rep['fields'] if f['blocking'] and len(f['values']) > 1)
          base = mk('0.28.0', '580.126.20', 'fp8')
          assert blocking([base, mk('0.28.0','580.126.20','fp8')]) == [], 'identical stacks must not trip'
          for other, expect in ((mk('0.19.1','580.126.20','fp8'), 'runtime.vllm_version'),
                                (mk('0.28.0','570.148.08','fp8'), 'runtime.nvidia_driver'),
                                (mk('0.28.0','580.126.20','none'), 'model.quantization')):
              got = blocking([base, other])
              assert got == [expect], 'expected %r to block, got %r' % (expect, got)
          print('serving-stack comparability: vllm_version, nvidia_driver, quantization all blocking')"

      # The gamespec floor is what protects human judging time, so it has to be correct
      # before any judge sees anything. Running it against the reference implementation on
      # every push is the cheapest way to keep it honest — and the reference is also what
      # keeps the SPEC honest, since a spec no one has implemented is a spec with holes.
      - name: gamespec floor check (reference implementation)
        run: python3 suites/gamespec/floor_check.py suites/gamespec/specs/racing-v1.reference.html

      - name: Leakage guard self-test
        run: python training/build_dataset.py --self-test

      - name: Git hygiene (no raw results or restricted content in the tree)
        # --all scans every TRACKED file. The default scope is the staged diff, which is
        # empty after actions/checkout — without --all this step inspected nothing.
        run: ./resultsctl verify --git-hygiene --all

      - name: End-to-end smoke (mock endpoint, synthetic suite, no GPU)
        run: ./smoke/run-smoke.sh

      # The figures are how the result actually leaves this repo, so they get the same
      # treatment as everything else: if plots.py cannot render, CI is red. --demo needs
      # no run bundle, which keeps this a one-command check on every push.
      - name: Figures render
        run: |
          python -m pip install --quiet matplotlib
          python analysis/plots.py --demo --out-dir "$RUNNER_TEMP/figures"
          n=$(ls -1 "$RUNNER_TEMP/figures"/*.png | wc -l)
          [ "$n" -eq 5 ] || { echo "expected 5 figures, got $n" >&2; exit 1; }
          echo "ok: $n figures"
