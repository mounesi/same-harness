# Cheap checks on every push: syntax, imports, the leakage guard, and a full end-to-end
# smoke run against a mock endpoint. No GPU, no credit, ~1 minute.
#
# This is the regression net for the class of bug that hurts most here: the pipeline breaks
# in a way no syntax check can see, and you find out on a $54/hr node after the weights
# have downloaded. If this job is green, the harness is wired.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (pytest is the agenttask grader)
        run: python -m pip install --quiet pytest

      - name: Shell syntax
        shell: bash
        run: |
          # Every file is checked and ANY failure fails the step. (The previous
          # `bash -n "$f" && echo ok` form was exempt from -e and reported only the last
          # iteration's status, so a syntax error anywhere but the last file passed green.)
          fail=0
          for f in modelctl lambdactl resultsctl harness/run.sh training/train_lora.sh smoke/run-smoke.sh \
                   $(find . -name '*.sh' -not -path './.git/*' | sort); do
            if bash -n "$f"; then echo "ok $f"; else echo "SYNTAX ERROR: $f" >&2; fail=1; fi
          done
          exit "$fail"

      - name: Python compiles
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 python -m py_compile
          echo ok

      - name: Adapters import cleanly
        run: |
          python -c "
          import harness.adapters as A
          assert not A.IMPORT_ERRORS, A.IMPORT_ERRORS
          print('adapters:', sorted(A.ADAPTERS))"

      - name: Leakage guard self-test
        run: python training/build_dataset.py --self-test

      - name: Git hygiene (no raw results or restricted content in the tree)
        # --all scans every TRACKED file. The default scope is the staged diff, which is
        # empty after actions/checkout — without --all this step inspected nothing.
        run: ./resultsctl verify --git-hygiene --all

      - name: End-to-end smoke (mock endpoint, synthetic suite, no GPU)
        run: ./smoke/run-smoke.sh
