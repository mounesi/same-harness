# Benchmark run: bring a Lambda GPU server up, serve the model, run the harness, tear down.
# Teardown discovers the instance BY NAME TAG (ci-<model>-<run_id>), not only by step output,
# so a launch that dies mid-wait still gets cleaned up. (Per codex architecture review.)
#
# Repo secrets: LAMBDA_API_KEY, LAMBDA_SSH_PRIVATE_KEY
# Repo variables: LAMBDA_SSH_KEY (key name in Lambda), LAMBDA_FS (persistent filesystem), VLLM_VERSION (pinned)
name: benchmark-run

on:
  workflow_dispatch:
    inputs:
      model:
        description: "model name (must exist in models.d/; instance type derives from its INSTANCE_TYPE)"
        required: true
        type: choice
        options: [qwen3-coder-next, minimax-m3, deepseek-v4-flash, glm-5.3, kimi-k3]
      suite:
        description: "benchmark suite"
        required: true
        default: all
        type: choice
        options: [all, swebench-verified, swebench-pro, agenttask]

concurrency:
  group: gpu-run            # one GPU run at a time — no accidental double spend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 720    # 12h hard ceiling on any run
    env:
      LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
      LAMBDA_SSH_KEY: ${{ vars.LAMBDA_SSH_KEY }}
      LAMBDA_FS: ${{ vars.LAMBDA_FS }}
      VLLM_VERSION: ${{ vars.VLLM_VERSION }}
      INSTANCE_NAME: ci-${{ inputs.model }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Derive instance type from model profile
        id: profile
        run: |
          source "models.d/${{ inputs.model }}.env"
          [[ -n "${INSTANCE_TYPE:-}" ]] || { echo "models.d/${{ inputs.model }}.env has no INSTANCE_TYPE"; exit 1; }
          [[ "${MULTINODE:-0}" == "1" ]] && { echo "multi-node models are not CI-supported yet"; exit 1; }
          echo "instance_type=$INSTANCE_TYPE" >> "$GITHUB_OUTPUT"

      - name: Bring GPU server up
        id: up
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          # lambdactl prints the id immediately after the launch API accepts; even if the
          # readiness wait fails after that, teardown finds the instance by INSTANCE_NAME.
          read -r ID IP < <(./lambdactl up "${{ steps.profile.outputs.instance_type }}" | tail -n1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Provision + serve model
        run: |
          IP=${{ steps.up.outputs.ip }}
          scp -o StrictHostKeyChecking=accept-new -r modelctl models.d "ubuntu@$IP:~/"
          ssh "ubuntu@$IP" "pip install -q 'vllm==${VLLM_VERSION}' hf_transfer"
          ssh "ubuntu@$IP" "WEIGHTS_DIR=/home/ubuntu/$LAMBDA_FS/models ./modelctl serve ${{ inputs.model }}"

      - name: Run harness
        run: |
          IP=${{ steps.up.outputs.ip }}
          ssh "ubuntu@$IP" "./harness/run.sh --model ${{ inputs.model }} --suite ${{ inputs.suite }} --passes 3 --out ~/results"
          mkdir -p results && scp -r "ubuntu@$IP:~/results/*" results/

      - name: Tear GPU server down (ALWAYS, by name tag)
        if: always()
        id: down
        run: |
          # primary: the step output; fallback: discover by name tag
          ./lambdactl down "${{ steps.up.outputs.id || env.INSTANCE_NAME }}" \
            && echo "confirmed=true" >> "$GITHUB_OUTPUT" \
            || echo "confirmed=false" >> "$GITHUB_OUTPUT"
          ./lambdactl ls   # visible post-teardown state in the log

      - name: Record cost ledger entry
        if: always()
        run: |
          [[ -n "${{ steps.up.outputs.started_at }}" ]] || exit 0
          SECS=$(( $(date +%s) - ${{ steps.up.outputs.started_at }} ))
          mkdir -p results
          printf '{"model":"%s","instance_type":"%s","instance_id":"%s","seconds":%d,"termination_confirmed":%s,"run_id":"%s","note":"workflow-elapsed; reconcile against Lambda billing"}\n' \
            "${{ inputs.model }}" "${{ steps.profile.outputs.instance_type }}" \
            "${{ steps.up.outputs.id }}" "$SECS" "${{ steps.down.outputs.confirmed || 'false' }}" \
            "${{ github.run_id }}" | tee -a results/cost-log.jsonl

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.model }}-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
