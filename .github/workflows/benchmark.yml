# Benchmark run: bring a Lambda GPU server up, serve the model, run the harness, tear down.
# Teardown discovers the instance BY NAME TAG (sh-ci-<model>-<run_id>-<run_attempt>), not only by
# step output, so a launch that dies mid-wait still gets cleaned up. The attempt number is part
# of the tag: a GitHub re-run must never resolve to the previous attempt's terminating instance.
#
# Repo secrets: LAMBDA_API_KEY, LAMBDA_SSH_PRIVATE_KEY
# Repo variables: LAMBDA_SSH_KEY (key name in Lambda), LAMBDA_FS (persistent filesystem), VLLM_VERSION (pinned)
name: benchmark-run

on:
  workflow_dispatch:
    inputs:
      model:
        description: "model name (must exist in models.d/; instance type derives from its INSTANCE_TYPE)"
        required: true
        type: choice
        options: [qwen3-coder-next, minimax-m3, deepseek-v4-flash, glm-5.3, kimi-k3]
      suite:
        description: "benchmark suite"
        required: true
        default: swebench-verified
        type: choice
        # NOTE: "all" runs three suites sequentially and will not fit the 720m job
        # ceiling for a large model — dispatch one suite per run instead.
        options: [swebench-verified, swebench-pro, agenttask, all]

concurrency:
  group: gpu-run            # one GPU run at a time — no accidental double spend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 720    # 12h hard ceiling on any run
    env:
      LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
      LAMBDA_SSH_KEY: ${{ vars.LAMBDA_SSH_KEY }}
      LAMBDA_FS: ${{ vars.LAMBDA_FS }}
      VLLM_VERSION: ${{ vars.VLLM_VERSION }}
      INSTANCE_NAME: sh-ci-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}
      WEIGHTS_DIR: /home/ubuntu/${{ vars.LAMBDA_FS }}/models
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Derive instance type from model profile
        id: profile
        run: |
          source "models.d/${{ inputs.model }}.env"
          [[ -n "${INSTANCE_TYPE:-}" ]] || { echo "models.d/${{ inputs.model }}.env has no INSTANCE_TYPE"; exit 1; }
          [[ "${MULTINODE:-0}" == "1" ]] && { echo "multi-node models are not CI-supported yet"; exit 1; }
          # Cheap gate BEFORE any instance is launched: the harness refuses placeholder
          # partitions (§6.2) — discovering that after provisioning an 8xB200 is dead money.
          python3 - <<'PY2'
          import json, sys
          p = json.load(open("suites/partitions.json"))
          if p.get("placeholder"):
              print("::error::suites/partitions.json is still a placeholder — freeze it before any paid run (AI-2955)")
              sys.exit(1)
          PY2
          echo "instance_type=$INSTANCE_TYPE" >> "$GITHUB_OUTPUT"
          # List price for the cost ledger below, as a FALLBACK: the ledger step prefers the
          # price the harness resolved into each run manifest. Best-effort: an empty value just
          # means the ledger records setup SECONDS without dollars, which aggregate.py tolerates.
          # `./lambdactl types` prints "<name>   $  23.92/hr  <regions>" — the "$" is its own
          # field, so parse with the same regex harness/manifest.py uses, not by column.
          CPH="$(./lambdactl types 2>/dev/null \
                 | awk -v t="$INSTANCE_TYPE" '$1==t && match($0, /\$[ ]*[0-9]+(\.[0-9]+)?\/hr/) {
                     p=substr($0, RSTART+1, RLENGTH-4); gsub(/ /, "", p); printf "%.0f", p*100; exit }')" || CPH=""
          # a parsed 0 is "unknown", never a price
          [[ -n "$CPH" && "$CPH" != "0" ]] || CPH=""
          echo "price_cents_per_hour=$CPH" >> "$GITHUB_OUTPUT"
          echo "==> $INSTANCE_TYPE at ${CPH:-unknown} cents/hour (list price; ledger prefers the run manifest)" >&2

      - name: Bring GPU server up
        id: up
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          # lambdactl prints the id immediately after the launch API accepts; even if the
          # readiness wait fails after that, teardown finds the instance by INSTANCE_NAME.
          read -r ID IP < <(./lambdactl up "${{ steps.profile.outputs.instance_type }}" | tail -n1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Ship repo to instance
        run: |
          IP=${{ steps.up.outputs.ip }}
          # the WHOLE checkout: harness/, suites/, pricing/, docs/, resultsctl, and .git —
          # manifest.py needs `git rev-parse HEAD` for the REQUIRED repo_git_sha field.
          tar -czf /tmp/repo.tgz --exclude=.github .
          scp -o StrictHostKeyChecking=accept-new /tmp/repo.tgz "ubuntu@$IP:~/"
          ssh "ubuntu@$IP" "mkdir -p ~/harness-repo && tar -xzf ~/repo.tgz -C ~/harness-repo"
          # Lease the box to this job for the job's own ceiling: from here on the 15-minute
          # watchdog (reaper.yml -> ./gpuwatch) knows it is busy. If this workflow dies before
          # its teardown, the lease expires with the job and the watchdog finishes the cleanup.
          ssh "ubuntu@$IP" "cd ~/harness-repo && ./gpu-lease claim 12h 'ci:${{ inputs.model }}/${{ inputs.suite }}' github-actions"

      - name: Provision + serve model
        id: serve
        run: |
          IP=${{ steps.up.outputs.ip }}
          ssh "ubuntu@$IP" "pip install -q 'vllm==${VLLM_VERSION}' hf_transfer"
          # grading dependencies are pinned in harness/requirements.lock (codex invariant 5)
          ssh "ubuntu@$IP" "cd ~/harness-repo && pip install -q -r harness/requirements.lock"
          ssh "ubuntu@$IP" "cd ~/harness-repo && WEIGHTS_DIR=$WEIGHTS_DIR ./modelctl serve ${{ inputs.model }}"
          # Everything up to here is SETUP: instance provision + weight download + vLLM load.
          # CONTRACTS.md §8 reports that time separately and never folds it into
          # cost_per_resolved, so the ledger step needs the boundary timestamp.
          echo "setup_done_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run harness
        # `shell: bash` is load-bearing: it selects `bash --noprofile --norc -eo pipefail`.
        # The default for a bare `run:` is `bash -e {0}` with NO pipefail, so the
        # `| tee` below would report tee's status and a failed run would look green.
        shell: bash
        env:
          # provenance the manifest requires but cannot discover from inside the instance
          LAMBDA_INSTANCE_ID: ${{ steps.up.outputs.id }}
          LAMBDA_INSTANCE_TYPE: ${{ steps.profile.outputs.instance_type }}
        run: |
          IP=${{ steps.up.outputs.ip }}
          mkdir -p results
          # run.sh stdout is machine-readable only: one "RUN <run_id> <suite> <dir> <status>"
          # line per run (§1.4). Capture it — the harness run_id is the ONLY join key between
          # the cost ledger and analysis/aggregate.py (§3.1). tee writes as lines arrive, so a
          # run that dies mid-flight still leaves the ids it already emitted.
          ssh "ubuntu@$IP" "cd ~/harness-repo && \
            WEIGHTS_DIR=$WEIGHTS_DIR \
            LAMBDA_INSTANCE_ID='${LAMBDA_INSTANCE_ID}' \
            LAMBDA_INSTANCE_TYPE='${LAMBDA_INSTANCE_TYPE}' \
            GITHUB_RUN_ID='${{ github.run_id }}' \
            ./harness/run.sh --model ${{ inputs.model }} --suite ${{ inputs.suite }} --passes 3 --out ~/results" \
            | tee -a results/run-lines.txt

      - name: Package run bundles + pull provenance (never trajectories/ or patches/)
        if: always()   # an exit-4 (incomplete) run still has results worth keeping
        shell: bash
        run: |
          IP="${{ steps.up.outputs.ip }}"
          RUNS=results/run-lines.txt
          if [[ -z "$IP" ]]; then echo "==> no instance — nothing to package"; exit 0; fi
          if [[ ! -f "$RUNS" ]] || ! grep -q '^RUN ' "$RUNS"; then
            echo "==> no RUN lines captured — nothing to package"; exit 0
          fi
          # One bundle per run directory named in the RUN lines (§1.4: "RUN <run_id> <suite>
          # <run_dir> <status>"). resultsctl package takes a RUN DIRECTORY, never the --out root.
          # A package failure fails this step (a run whose checksums do not verify is not a
          # result) — but teardown below is if: always(), so the instance still dies.
          fail=0; packaged=0
          while read -r _ RID SUITE RDIR STATUS; do
            echo "==> packaging $RID ($SUITE, $STATUS) from $RDIR"
            # -n: ssh must NOT inherit the loop's stdin, or it swallows the remaining RUN lines
            # and every run after the first is silently never packaged.
            if ! ssh -n "ubuntu@$IP" "cd ~/harness-repo && ./resultsctl package '$RDIR' --dist ~/results/dist"; then
              echo "::error::resultsctl package failed for $RID" >&2; fail=1; continue
            fi
            mkdir -p "results/$RID"
            # ONLY provenance + integrity files come back into the GitHub artifact. The raw
            # results.jsonl, trajectories/, patches/, logs/ and env/ stay inside the sealed
            # bundle: §7.4 restricted content (agenttask) must never be pulled out loose.
            for f in run-manifest.json SHA256SUMS run-status.json; do
              scp -q "ubuntu@$IP:$RDIR/$f" "results/$RID/$f" </dev/null \
                || { echo "::error::could not fetch $RID/$f" >&2; fail=1; }
            done
            scp -q "ubuntu@$IP:results/dist/$RID.tar.gz" "ubuntu@$IP:results/dist/$RID.tar.gz.sha256" \
                "results/$RID/" </dev/null \
              || { echo "::error::could not fetch the bundle for $RID" >&2; fail=1; }
            packaged=$((packaged + 1))
          done < <(grep '^RUN ' "$RUNS")
          expected=$(grep -c '^RUN ' "$RUNS" || true)
          if (( packaged != expected )); then
            echo "::error::packaged $packaged of $expected runs" >&2; fail=1
          fi
          ls -laR results/ | sed 's/^/    /'
          exit "$fail"

      - name: Tear GPU server down (ALWAYS, by id AND by name tag)
        if: always()
        id: down
        shell: bash
        run: |
          ID="${{ steps.up.outputs.id }}"
          # Primary: the id the launch step captured. Secondary: EVERY instance carrying this
          # job's name tag (unique per run attempt), which catches a launch that died before
          # the id reached the step output. Both are attempted; neither aborts the other.
          rc=0
          if [[ -n "$ID" ]]; then ./lambdactl down "$ID" || rc=1; fi
          ./lambdactl down --all-named "$INSTANCE_NAME" || rc=1
          # Confirm from a FOLLOW-UP LISTING, not from the terminate call's exit status: the
          # step fails unless nothing with our id or name is left in a non-terminating state.
          # A listing that cannot be fetched is "not confirmed". Poll briefly — the API can
          # lag the terminate call by a few seconds.
          confirmed=false
          for _ in $(seq 1 12); do
            if LS="$(./lambdactl ls)"; then
              LIVE="$(awk -v id="$ID" -v name="$INSTANCE_NAME" \
                        '(id != "" && $1 == id) || $2 == name { if ($4 != "terminating" && $4 != "terminated") print }' \
                        <<<"$LS")"
              if [[ -z "$LIVE" ]]; then confirmed=true; break; fi
              echo "==> still live:"; echo "$LIVE"
            else
              echo "==> could not list instances; retrying"
            fi
            sleep 10
          done
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          echo "==> post-teardown state:"; ./lambdactl ls || true
          if [[ "$confirmed" != "true" ]]; then
            echo "::error::GPU instance NOT confirmed terminated (id='$ID' name='$INSTANCE_NAME'). Terminate it by hand: ./lambdactl down --all-named $INSTANCE_NAME" >&2
            exit 1
          fi
          [[ $rc -eq 0 ]] || echo "::warning::a terminate call failed, but the follow-up listing shows nothing live under id='$ID' / name='$INSTANCE_NAME'"

      # cost-log.jsonl is read by analysis/aggregate.py --cost-log, which joins on the HARNESS
      # run_id (<model>__<suite>__<ts>__<hex>) and reads setup_cost_usd / setup_seconds. It is
      # keyed by run_id, so the GitHub numeric id must never appear in that field.
      - name: Record cost ledger entry
        if: always()
        env:
          STARTED_AT: ${{ steps.up.outputs.started_at }}
          SETUP_DONE_AT: ${{ steps.serve.outputs.setup_done_at }}
          CPH: ${{ steps.profile.outputs.price_cents_per_hour }}
          ITYPE: ${{ steps.profile.outputs.instance_type }}
          IID: ${{ steps.up.outputs.id }}
          TERMINATED: ${{ steps.down.outputs.confirmed || 'false' }}
          GH_RUN_ID: ${{ github.run_id }}
          MODEL: ${{ inputs.model }}
        run: |
          [[ -n "$STARTED_AT" ]] || exit 0
          mkdir -p results
          ELAPSED=$(( $(date +%s) - STARTED_AT ))
          if [[ -n "$SETUP_DONE_AT" ]]; then
            SETUP_S=$(( SETUP_DONE_AT - STARTED_AT ))
            SETUP_COMPLETE=true
          else
            # never reached a served model: the whole job was setup that never paid off
            SETUP_S=$ELAPSED
            SETUP_COMPLETE=false
          fi

          # Job-level line for billing reconciliation. It deliberately carries NO "run_id" key:
          # the GitHub id is not a harness run id, and aggregate.py skips lines without one.
          printf '{"record":"job","github_run_id":"%s","model":"%s","instance_type":"%s","instance_id":"%s","job_elapsed_seconds":%d,"setup_seconds":%d,"setup_complete":%s,"termination_confirmed":%s,"price_cents_per_hour":%s,"note":"whole-workflow elapsed; reconcile against Lambda billing"}\n' \
            "$GH_RUN_ID" "$MODEL" "$ITYPE" "$IID" "$ELAPSED" "$SETUP_S" \
            "$SETUP_COMPLETE" "$TERMINATED" "${CPH:-null}" \
            | tee -a results/cost-log.jsonl

          RUNS=results/run-lines.txt
          N=0
          if [[ -f "$RUNS" ]]; then N=$(grep -c '^RUN ' "$RUNS" || true); fi
          if (( N == 0 )); then
            echo "==> no RUN lines captured — setup cost is not attributable to a harness run" >&2
            exit 0
          fi
          # One warm-up serves every run in the job (--suite all makes three), so split the
          # setup seconds evenly instead of charging the full warm-up to each run.
          SHARE=$(awk -v s="$SETUP_S" -v n="$N" 'BEGIN{printf "%.3f", s/n}')

          grep '^RUN ' "$RUNS" | while read -r _ RID SUITE _ STATUS; do
            # Price ladder per run: (1) price.effective_cents_per_hour from the run manifest the
            # package step pulled back — the SAME number aggregate.py prices the run with, so the
            # ledger cannot disagree with the headline; (2) the list price parsed above; (3) none.
            # A zero or missing value is "unknown", never a price.
            RUN_CPH=""; SRC=""
            M="results/$RID/run-manifest.json"
            if [[ -f "$M" ]]; then
              RUN_CPH="$(python3 -c 'import json,sys; v=((json.load(open(sys.argv[1])).get("price") or {}).get("effective_cents_per_hour")); print(int(v) if isinstance(v,(int,float)) and v>0 else "")' "$M" 2>/dev/null || true)"
            fi
            if [[ -n "$RUN_CPH" ]]; then SRC="run-manifest"; elif [[ -n "$CPH" ]]; then RUN_CPH="$CPH"; SRC="lambdactl-types"; fi
            PRICE=""
            if [[ -n "$RUN_CPH" ]]; then
              USD=$(awk -v s="$SHARE" -v c="$RUN_CPH" 'BEGIN{printf "%.6f", s/3600*c/100}')
              PRICE=$(printf '"effective_cents_per_hour":%s,"setup_cost_usd":%s,"price_source":"%s",' "$RUN_CPH" "$USD" "$SRC")
            fi
            printf '{"record":"run","run_id":"%s","suite":"%s","status":"%s","setup_seconds":%s,%s"setup_seconds_job_total":%d,"runs_in_job":%d,"setup_attribution":"even-split-across-runs-in-job","setup_complete":%s,"job_elapsed_seconds":%d,"github_run_id":"%s","model":"%s","instance_type":"%s","instance_id":"%s","note":"setup = provision + weight download + vLLM load; reported separately per CONTRACTS.md 8, never folded into cost_per_resolved"}\n' \
              "$RID" "$SUITE" "$STATUS" "$SHARE" "$PRICE" "$SETUP_S" "$N" \
              "$SETUP_COMPLETE" "$ELAPSED" "$GH_RUN_ID" "$MODEL" "$ITYPE" "$IID" \
              | tee -a results/cost-log.jsonl
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.model }}-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
