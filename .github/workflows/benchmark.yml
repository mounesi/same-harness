# Benchmark run: bring a Lambda GPU server up, serve the model, run the harness, tear down.
# Teardown discovers the instance BY NAME TAG (sh-ci-<model>-<run_id>-<run_attempt>), not only by
# step output, so a launch that dies mid-wait still gets cleaned up. The attempt number is part
# of the tag: a GitHub re-run must never resolve to the previous attempt's terminating instance.
#
# Repo secrets: LAMBDA_API_KEY, LAMBDA_SSH_PRIVATE_KEY
# Repo variables: LAMBDA_SSH_KEY (key name in Lambda), LAMBDA_FS (persistent filesystem), VLLM_VERSION (pinned)
name: benchmark-run

on:
  workflow_dispatch:
    inputs:
      model:
        description: "model name (must exist in models.d/; instance type derives from its INSTANCE_TYPE)"
        required: true
        type: choice
        options: [qwen3-coder-next, minimax-m3, deepseek-v4-flash, glm-5.3, kimi-k3]
      suite:
        description: "benchmark suite"
        required: true
        default: swebench-verified
        type: choice
        # NOTE: "all" runs three suites sequentially and will not fit the 720m job
        # ceiling for a large model — dispatch one suite per run instead.
        options: [swebench-verified, swebench-pro, agenttask, all]

concurrency:
  group: gpu-run            # one GPU run at a time — no accidental double spend
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 720    # 12h hard ceiling on any run
    env:
      LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
      LAMBDA_SSH_KEY: ${{ vars.LAMBDA_SSH_KEY }}
      LAMBDA_FS: ${{ vars.LAMBDA_FS }}
      # The GPU driver ships with the image. Unpinned, Lambda picks an older build
      # (570.148.08 / CUDA 12.8) than it publishes (580.126.20 / CUDA 13.0), which
      # silently caps which vLLM can run. Measured 2026-09-07; see AI-3166.
      LAMBDA_IMAGE: ${{ vars.LAMBDA_IMAGE }}
      VLLM_VERSION: ${{ vars.VLLM_VERSION }}
      INSTANCE_NAME: sh-ci-${{ inputs.model }}-${{ github.run_id }}-${{ github.run_attempt }}
      # Everything this job installs on the instance lives in ONE hermetic venv, at the same
      # path gpuctl's install_stack() builds (~/$VENV_NAME, gpuctl default harness-venv, ssh
      # user ubuntu) — the "Derive instance type" step asserts that default still holds, so
      # this hardcoded path cannot drift away from gpuctl's silently. The two paths install
      # the same way; they do not RUN the same way — gpuctl stops at `modelctl serve` and
      # never invokes the harness, so the harness step's PATH/HARNESS_PYTHON wiring below has
      # no gpuctl counterpart (RUNBOOK §1.4 tells a human to export the equivalent).
      # Written absolute, not as ~: these paths are interpolated LOCALLY into ssh command
      # strings, where the runner's HOME is not the instance's.
      VENV: /home/ubuntu/harness-venv
      # WEIGHTS_DIR is NOT hardcoded here. Lambda mounts persistent filesystems at
      # /lambda/nfs/<name>, not under $HOME, and only the API knows the mount point — the
      # old `/home/ubuntu/<fs>/models` resolved to ephemeral disk, which fails silently:
      # the run works and simply re-downloads the weights, on the meter, every time.
      # The serve step resolves it with `lambdactl fs` and asserts it is really a mount.
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LAMBDA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Derive instance type from model profile
        id: profile
        run: |
          source "models.d/${{ inputs.model }}.env"
          [[ -n "${INSTANCE_TYPE:-}" ]] || { echo "models.d/${{ inputs.model }}.env has no INSTANCE_TYPE"; exit 1; }
          [[ "${MULTINODE:-0}" == "1" ]] && { echo "multi-node models are not CI-supported yet"; exit 1; }
          # Everything from here to the end of this step is a CHEAP GATE: it runs on the
          # runner, before `lambdactl up`, so a misconfiguration costs nothing. install_stack()
          # checks VLLM_VERSION at install time because it runs on a box the operator already
          # leased by hand; here the instance is not leased yet, so check it now — an unset
          # repo variable must not cost a provision to discover.
          [[ -n "${VLLM_VERSION:-}" ]] \
            || { echo "::error::repo variable VLLM_VERSION is unset — the serving stack would be whatever the image carries and the run would not be reproducible"; exit 1; }
          # The job env hardcodes VENV=/home/ubuntu/harness-venv; gpuctl parameterizes the
          # same directory as ~/$VENV_NAME. Nothing connects the two strings, so assert the
          # gpuctl default rather than assuming it: if it moves, this fails on the runner
          # instead of leaving CI and the by-hand path on two different venvs.
          grep -Fq 'VENV_NAME="${VENV_NAME:-harness-venv}"' gpuctl \
            || { echo "::error::gpuctl's VENV_NAME default no longer reads harness-venv — VENV=$VENV in this workflow was chosen to match it. Update both together."; exit 1; }
          # Cheap gate BEFORE any instance is launched: the harness refuses placeholder
          # partitions (§6.2) — discovering that after provisioning an 8xB200 is dead money.
          python3 - <<'PY2'
          import json, sys
          p = json.load(open("suites/partitions.json"))
          if p.get("placeholder"):
              print("::error::suites/partitions.json is still a placeholder — freeze it before any paid run (AI-2955)")
              sys.exit(1)
          PY2
          echo "instance_type=$INSTANCE_TYPE" >> "$GITHUB_OUTPUT"
          # List price for the cost ledger below, as a FALLBACK: the ledger step prefers the
          # price the harness resolved into each run manifest. Best-effort: an empty value just
          # means the ledger records setup SECONDS without dollars, which aggregate.py tolerates.
          # `./lambdactl types` prints "<name>   $  23.92/hr  <regions>" — the "$" is its own
          # field, so parse with the same regex harness/manifest.py uses, not by column.
          CPH="$(./lambdactl types 2>/dev/null \
                 | awk -v t="$INSTANCE_TYPE" '$1==t && match($0, /\$[ ]*[0-9]+(\.[0-9]+)?\/hr/) {
                     p=substr($0, RSTART+1, RLENGTH-4); gsub(/ /, "", p); printf "%.0f", p*100; exit }')" || CPH=""
          # a parsed 0 is "unknown", never a price
          [[ -n "$CPH" && "$CPH" != "0" ]] || CPH=""
          echo "price_cents_per_hour=$CPH" >> "$GITHUB_OUTPUT"
          echo "==> $INSTANCE_TYPE at ${CPH:-unknown} cents/hour (list price; ledger prefers the run manifest)" >&2

      - name: Bring GPU server up
        id: up
        run: |
          echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
          # lambdactl prints the id immediately after the launch API accepts; even if the
          # readiness wait fails after that, teardown finds the instance by INSTANCE_NAME.
          read -r ID IP < <(./lambdactl up "${{ steps.profile.outputs.instance_type }}" | tail -n1)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Ship repo to instance
        run: |
          IP=${{ steps.up.outputs.ip }}
          # the WHOLE checkout: harness/, suites/, pricing/, docs/, resultsctl, and .git —
          # manifest.py needs `git rev-parse HEAD` for the REQUIRED repo_git_sha field.
          tar -czf /tmp/repo.tgz --exclude=.github .
          scp -o StrictHostKeyChecking=accept-new /tmp/repo.tgz "ubuntu@$IP:~/"
          ssh "ubuntu@$IP" "mkdir -p ~/harness-repo && tar -xzf ~/repo.tgz -C ~/harness-repo"
          # Lease the box to this job for the job's own ceiling: from here on the watchdog
          # (reaper.yml -> ./gpuwatch) knows it is busy. If this workflow dies before its
          # teardown, the lease expires with the job and the watchdog finishes the cleanup —
          # on its real cadence, which is hours apart, not the 15 min its cron asks for
          # (measured; see the reaper.yml header). The teardown step below is what makes
          # normal termination prompt; the watchdog is only the backstop.
          ssh "ubuntu@$IP" "cd ~/harness-repo && ./gpu-lease claim 12h 'ci:${{ inputs.model }}/${{ inputs.suite }}' github-actions"

      - name: Provision + serve model
        id: serve
        run: |
          IP=${{ steps.up.outputs.ip }}

          # Resolve the real mount point, then PROVE it is a mount before downloading onto
          # it. Both halves matter: the path is not derivable from the name, and a wrong
          # path is otherwise invisible until someone notices the download happening twice.
          MOUNT=$(./lambdactl fs "$LAMBDA_FS" | awk '{print $3}')
          [ -n "$MOUNT" ] && [ "$MOUNT" != "-" ] || { echo "::error::filesystem '$LAMBDA_FS' has no mount point"; exit 1; }
          WEIGHTS_DIR="$MOUNT/models"
          echo "weights dir: $WEIGHTS_DIR"
          # Shell variables do not survive between steps; the harness step needs this too.
          echo "WEIGHTS_DIR=$WEIGHTS_DIR" >> "$GITHUB_ENV"
          ssh "ubuntu@$IP" "mountpoint -q '$MOUNT'" \
            || { echo "::error::'$MOUNT' is not a mount on the instance — the filesystem did not attach (region mismatch?). Refusing to download weights onto ephemeral disk."; exit 1; }
          ssh "ubuntu@$IP" "mkdir -p '$WEIGHTS_DIR'"

          # VLLM_VERSION was asserted in the "Derive instance type" step, before this
          # instance existed — it cannot be empty here.

          # A HERMETIC venv: python3 -m venv, deliberately WITHOUT --system-site-packages.
          # This step used to `pip install` into the image's python. The Lambda image ships
          # an apt-managed scientific stack in /usr/lib/python3/dist-packages compiled
          # against numpy 1.x, and a --user install upgrades numpy to 2.x underneath it;
          # the two then shadow each other:
          #   apt scipy 1.8.0 -> ImportError: cannot import name 'Inf' from 'numpy'
          #   apt sklearn     -> ValueError: numpy.dtype size changed (ABI mismatch)
          # Both observed on the AI-P167 shakedown, one after the other, each costing a
          # serve attempt on a GPU that bills by the hour while it fails (the largest
          # instance in pricing/fallback-prices.json is $39.92/hr). With dist-packages hidden
          # the conflict cannot arise. It also makes runtime.requirements_lock_sha256 mean
          # something: the lock then describes the environment that actually ran.
          ssh "ubuntu@$IP" "test -x $VENV/bin/python || python3 -m venv $VENV"
          ssh "ubuntu@$IP" "$VENV/bin/pip install -q --upgrade pip setuptools wheel"
          # ONE resolution pass. Installing vLLM and then the lock separately lets the
          # second install silently downgrade a dependency out from under the first — that
          # is how huggingface_hub landed on 0.27.1 under a vLLM requiring >=1.27.0, with
          # only a pip warning to show for it. Resolved together, an incompatibility is an
          # error here instead of a failure after the weights.
          # (grading dependencies are pinned in harness/requirements.lock — codex invariant 5)
          #
          # pytest is named EXPLICITLY because it is not in that lock, and it is the
          # agenttask grader: the adapter runs its hidden tests through a shell as
          # `python3 -m pytest` (GRADER_PYTHON, harness/adapters/agenttask.py). Every other
          # place in the repo installs it as its own step for the same reason (README.md,
          # RUNBOOK.md §1.1, .github/workflows/ci.yml). Nothing did that on this instance,
          # and a venv built without --system-site-packages cannot fall back on an
          # image-provided one — so without this word the tier-3 grading preflight
          # (grading_requirements() -> run.sh exit 3) refuses to start the run here, after
          # the provision, the install, the weights and the vLLM load. Named in the SAME pip
          # invocation so it is resolved WITH vLLM, not after it.
          ssh "ubuntu@$IP" "cd ~/harness-repo && $VENV/bin/pip install -q 'vllm==${VLLM_VERSION}' hf_transfer pytest -r harness/requirements.lock" \
            || { echo "::error::could not install the pinned stack — vllm==${VLLM_VERSION}, pytest and harness/requirements.lock may be mutually unsatisfiable. Resolve them together; do not install them in sequence."; exit 1; }

          # Fail here, cheaply, rather than after the weights load. Import vLLM's CUDA
          # platform module, not merely torch: with a force-installed cu128 torch,
          # torch.cuda.is_available() returns True and a torch-only check passes, and then
          # vLLM dies at serve time — AFTER the download — on
          #     ImportError: libcudart.so.13  (vllm._C_stable_libtorch)
          # because vLLM ships its OWN compiled extension linked against a CUDA runtime
          # that has nothing to do with torch's. Same guard as gpuctl's install_stack().
          echo "==> checking the GPU is visible to this stack, and that vLLM itself loads"
          ssh "ubuntu@$IP" "$VENV/bin/python -" <<'PYGPU' \
            || { echo "::error::the installed stack cannot serve on this instance (see above). Nothing has been downloaded yet — pin a compatible VLLM_VERSION and re-run."; exit 1; }
          import sys
          import torch
          if not torch.cuda.is_available():
              sys.exit('torch %s (cuda %s) cannot see the GPU — the host driver is older than this '
                       'build. Pin a vLLM whose torch targets this driver.' % (torch.__version__, torch.version.cuda))
          try:
              import vllm.platforms.cuda  # the compiled extension, linked to its own CUDA runtime
          except Exception as exc:
              sys.exit('torch works, but vLLM will not load on this host: %s: %s. vLLM ships its own '
                       'CUDA extension; a torch that runs here does not imply a vLLM that runs here.'
                       % (type(exc).__name__, exc))
          print('  gpu ok:', torch.cuda.get_device_name(0), '| torch', torch.__version__,
                'cuda', torch.version.cuda, '| vllm loads')
          PYGPU

          # modelctl must use the venv for BOTH jobs: HARNESS_PYTHON drives the weights
          # download (huggingface_hub lives in the venv, not in the system python) and
          # VLLM_BIN drives the server. Leaving either pointed at the system interpreter
          # reintroduces the apt/pip split the venv exists to remove. Passing VLLM_BIN as an
          # absolute path is also what puts the venv's bin on PATH inside modelctl, which
          # vLLM needs: it execs `ninja` BY NAME while FlashInfer JIT-compiles kernels
          # during engine startup.
          ssh "ubuntu@$IP" "cd ~/harness-repo && WEIGHTS_DIR=$WEIGHTS_DIR \
            HARNESS_PYTHON=$VENV/bin/python VLLM_BIN=$VENV/bin/vllm \
            ./modelctl serve ${{ inputs.model }}"
          # Everything up to here is SETUP: instance provision + weight download + vLLM load.
          # CONTRACTS.md §8 reports that time separately and never folds it into
          # cost_per_resolved, so the ledger step needs the boundary timestamp.
          echo "setup_done_at=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Run harness
        # `shell: bash` is load-bearing: it selects `bash --noprofile --norc -eo pipefail`.
        # The default for a bare `run:` is `bash -e {0}` with NO pipefail, so the
        # `| tee` below would report tee's status and a failed run would look green.
        shell: bash
        env:
          # provenance the manifest requires but cannot discover from inside the instance
          LAMBDA_INSTANCE_ID: ${{ steps.up.outputs.id }}
          LAMBDA_INSTANCE_TYPE: ${{ steps.profile.outputs.instance_type }}
        run: |
          IP=${{ steps.up.outputs.ip }}
          mkdir -p results
          # run.sh stdout is machine-readable only: one "RUN <run_id> <suite> <dir> <status>"
          # line per run (§1.4). Capture it — the harness run_id is the ONLY join key between
          # the cost ledger and analysis/aggregate.py (§3.1). tee writes as lines arrive, so a
          # run that dies mid-flight still leaves the ids it already emitted.
          # The venv on PATH is load-bearing, not tidiness: the agenttask adapter grades by
          # running its hidden tests through a SHELL as `python3 -m pytest` (GRADER_PYTHON,
          # harness/adapters/agenttask.py), so PATH decides which interpreter — and which
          # pytest — grades. pytest is not in harness/requirements.lock, and nothing in this
          # workflow puts it in the image's python3; the provision step above installs it
          # into $VENV, and that venv is hermetic, so it cannot borrow one from the image
          # either. $VENV/bin therefore has to come FIRST, so that `python3 -m pytest`
          # resolves to the interpreter that has it. If it does not, the tier-3 grading
          # preflight (grading_requirements() -> harness/run.sh exit 3) refuses to start the
          # run; opted out of with HARNESS_SKIP_GRADING_PREFLIGHT=1, grade() then raises
          # GraderError on every attempt instead — rc 127 / "No module named pytest" is
          # caught explicitly (agenttask.py, "a runner that never ran is not a verdict"), so
          # the whole run costs its GPU hours and produces no scored verdict at all.
          # HARNESS_PYTHON pins run.sh's own driver to the same interpreter regardless of
          # PATH order; the harness modules need the locked deps, which live only in the venv.
          # Known consequence: the hidden tests now execute against the venv's packages
          # instead of the image's /usr/lib/python3/dist-packages. environment_digest()
          # records grader_python and the pytest version, but not the rest of what is
          # importable — so that part is missing from the DIGEST, not from the audit trail:
          # run.sh writes env/pip-freeze.txt with this same interpreter (HARNESS_PYTHON) and
          # the manifest carries its sha256 as runtime.pip_freeze_sha256.
          ssh "ubuntu@$IP" "cd ~/harness-repo && \
            PATH=$VENV/bin:\$PATH \
            HARNESS_PYTHON=$VENV/bin/python \
            WEIGHTS_DIR=$WEIGHTS_DIR \
            LAMBDA_INSTANCE_ID='${LAMBDA_INSTANCE_ID}' \
            LAMBDA_INSTANCE_TYPE='${LAMBDA_INSTANCE_TYPE}' \
            GITHUB_RUN_ID='${{ github.run_id }}' \
            ./harness/run.sh --model ${{ inputs.model }} --suite ${{ inputs.suite }} --passes 3 --out ~/results" \
            | tee -a results/run-lines.txt

      - name: Package run bundles + pull provenance (never trajectories/ or patches/)
        if: always()   # an exit-4 (incomplete) run still has results worth keeping
        shell: bash
        run: |
          IP="${{ steps.up.outputs.ip }}"
          RUNS=results/run-lines.txt
          if [[ -z "$IP" ]]; then echo "==> no instance — nothing to package"; exit 0; fi
          if [[ ! -f "$RUNS" ]] || ! grep -q '^RUN ' "$RUNS"; then
            echo "==> no RUN lines captured — nothing to package"; exit 0
          fi
          # One bundle per run directory named in the RUN lines (§1.4: "RUN <run_id> <suite>
          # <run_dir> <status>"). resultsctl package takes a RUN DIRECTORY, never the --out root.
          # A package failure fails this step (a run whose checksums do not verify is not a
          # result) — but teardown below is if: always(), so the instance still dies.
          fail=0; packaged=0
          while read -r _ RID SUITE RDIR STATUS; do
            echo "==> packaging $RID ($SUITE, $STATUS) from $RDIR"
            # -n: ssh must NOT inherit the loop's stdin, or it swallows the remaining RUN lines
            # and every run after the first is silently never packaged.
            if ! ssh -n "ubuntu@$IP" "cd ~/harness-repo && ./resultsctl package '$RDIR' --dist ~/results/dist"; then
              echo "::error::resultsctl package failed for $RID" >&2; fail=1; continue
            fi
            mkdir -p "results/$RID"
            # ONLY provenance + integrity files come back into the GitHub artifact. The raw
            # results.jsonl, trajectories/, patches/, logs/ and env/ stay inside the sealed
            # bundle: §7.4 restricted content (agenttask) must never be pulled out loose.
            for f in run-manifest.json SHA256SUMS run-status.json; do
              scp -q "ubuntu@$IP:$RDIR/$f" "results/$RID/$f" </dev/null \
                || { echo "::error::could not fetch $RID/$f" >&2; fail=1; }
            done
            scp -q "ubuntu@$IP:results/dist/$RID.tar.gz" "ubuntu@$IP:results/dist/$RID.tar.gz.sha256" \
                "results/$RID/" </dev/null \
              || { echo "::error::could not fetch the bundle for $RID" >&2; fail=1; }
            packaged=$((packaged + 1))
          done < <(grep '^RUN ' "$RUNS")
          expected=$(grep -c '^RUN ' "$RUNS" || true)
          if (( packaged != expected )); then
            echo "::error::packaged $packaged of $expected runs" >&2; fail=1
          fi
          ls -laR results/ | sed 's/^/    /'
          exit "$fail"

      - name: Tear GPU server down (ALWAYS, by id AND by name tag)
        if: always()
        id: down
        shell: bash
        run: |
          ID="${{ steps.up.outputs.id }}"
          # Primary: the id the launch step captured. Secondary: EVERY instance carrying this
          # job's name tag (unique per run attempt), which catches a launch that died before
          # the id reached the step output. Both are attempted; neither aborts the other.
          rc=0
          if [[ -n "$ID" ]]; then ./lambdactl down "$ID" || rc=1; fi
          ./lambdactl down --all-named "$INSTANCE_NAME" || rc=1
          # Confirm from a FOLLOW-UP LISTING, not from the terminate call's exit status: the
          # step fails unless nothing with our id or name is left in a non-terminating state.
          # A listing that cannot be fetched is "not confirmed". Poll briefly — the API can
          # lag the terminate call by a few seconds.
          confirmed=false
          for _ in $(seq 1 12); do
            if LS="$(./lambdactl ls)"; then
              LIVE="$(awk -v id="$ID" -v name="$INSTANCE_NAME" \
                        '(id != "" && $1 == id) || $2 == name { if ($4 != "terminating" && $4 != "terminated") print }' \
                        <<<"$LS")"
              if [[ -z "$LIVE" ]]; then confirmed=true; break; fi
              echo "==> still live:"; echo "$LIVE"
            else
              echo "==> could not list instances; retrying"
            fi
            sleep 10
          done
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          echo "==> post-teardown state:"; ./lambdactl ls || true
          if [[ "$confirmed" != "true" ]]; then
            echo "::error::GPU instance NOT confirmed terminated (id='$ID' name='$INSTANCE_NAME'). Terminate it by hand: ./lambdactl down --all-named $INSTANCE_NAME" >&2
            exit 1
          fi
          [[ $rc -eq 0 ]] || echo "::warning::a terminate call failed, but the follow-up listing shows nothing live under id='$ID' / name='$INSTANCE_NAME'"

      # cost-log.jsonl is read by analysis/aggregate.py --cost-log, which joins on the HARNESS
      # run_id (<model>__<suite>__<ts>__<hex>) and reads setup_cost_usd / setup_seconds. It is
      # keyed by run_id, so the GitHub numeric id must never appear in that field.
      - name: Record cost ledger entry
        if: always()
        env:
          STARTED_AT: ${{ steps.up.outputs.started_at }}
          SETUP_DONE_AT: ${{ steps.serve.outputs.setup_done_at }}
          CPH: ${{ steps.profile.outputs.price_cents_per_hour }}
          ITYPE: ${{ steps.profile.outputs.instance_type }}
          IID: ${{ steps.up.outputs.id }}
          TERMINATED: ${{ steps.down.outputs.confirmed || 'false' }}
          GH_RUN_ID: ${{ github.run_id }}
          MODEL: ${{ inputs.model }}
        run: |
          [[ -n "$STARTED_AT" ]] || exit 0
          mkdir -p results
          ELAPSED=$(( $(date +%s) - STARTED_AT ))
          if [[ -n "$SETUP_DONE_AT" ]]; then
            SETUP_S=$(( SETUP_DONE_AT - STARTED_AT ))
            SETUP_COMPLETE=true
          else
            # never reached a served model: the whole job was setup that never paid off
            SETUP_S=$ELAPSED
            SETUP_COMPLETE=false
          fi

          # Job-level line for billing reconciliation. It deliberately carries NO "run_id" key:
          # the GitHub id is not a harness run id, and aggregate.py skips lines without one.
          printf '{"record":"job","github_run_id":"%s","model":"%s","instance_type":"%s","instance_id":"%s","job_elapsed_seconds":%d,"setup_seconds":%d,"setup_complete":%s,"termination_confirmed":%s,"price_cents_per_hour":%s,"note":"whole-workflow elapsed; reconcile against Lambda billing"}\n' \
            "$GH_RUN_ID" "$MODEL" "$ITYPE" "$IID" "$ELAPSED" "$SETUP_S" \
            "$SETUP_COMPLETE" "$TERMINATED" "${CPH:-null}" \
            | tee -a results/cost-log.jsonl

          RUNS=results/run-lines.txt
          N=0
          if [[ -f "$RUNS" ]]; then N=$(grep -c '^RUN ' "$RUNS" || true); fi
          if (( N == 0 )); then
            echo "==> no RUN lines captured — setup cost is not attributable to a harness run" >&2
            exit 0
          fi
          # One warm-up serves every run in the job (--suite all makes three), so split the
          # setup seconds evenly instead of charging the full warm-up to each run.
          SHARE=$(awk -v s="$SETUP_S" -v n="$N" 'BEGIN{printf "%.3f", s/n}')

          grep '^RUN ' "$RUNS" | while read -r _ RID SUITE _ STATUS; do
            # Price ladder per run: (1) price.effective_cents_per_hour from the run manifest the
            # package step pulled back — the SAME number aggregate.py prices the run with, so the
            # ledger cannot disagree with the headline; (2) the list price parsed above; (3) none.
            # A zero or missing value is "unknown", never a price.
            RUN_CPH=""; SRC=""
            M="results/$RID/run-manifest.json"
            if [[ -f "$M" ]]; then
              RUN_CPH="$(python3 -c 'import json,sys; v=((json.load(open(sys.argv[1])).get("price") or {}).get("effective_cents_per_hour")); print(int(v) if isinstance(v,(int,float)) and v>0 else "")' "$M" 2>/dev/null || true)"
            fi
            if [[ -n "$RUN_CPH" ]]; then SRC="run-manifest"; elif [[ -n "$CPH" ]]; then RUN_CPH="$CPH"; SRC="lambdactl-types"; fi
            PRICE=""
            if [[ -n "$RUN_CPH" ]]; then
              USD=$(awk -v s="$SHARE" -v c="$RUN_CPH" 'BEGIN{printf "%.6f", s/3600*c/100}')
              PRICE=$(printf '"effective_cents_per_hour":%s,"setup_cost_usd":%s,"price_source":"%s",' "$RUN_CPH" "$USD" "$SRC")
            fi
            printf '{"record":"run","run_id":"%s","suite":"%s","status":"%s","setup_seconds":%s,%s"setup_seconds_job_total":%d,"runs_in_job":%d,"setup_attribution":"even-split-across-runs-in-job","setup_complete":%s,"job_elapsed_seconds":%d,"github_run_id":"%s","model":"%s","instance_type":"%s","instance_id":"%s","note":"setup = provision + weight download + vLLM load; reported separately per CONTRACTS.md 8, never folded into cost_per_resolved"}\n' \
              "$RID" "$SUITE" "$STATUS" "$SHARE" "$PRICE" "$SETUP_S" "$N" \
              "$SETUP_COMPLETE" "$ELAPSED" "$GH_RUN_ID" "$MODEL" "$ITYPE" "$IID" \
              | tee -a results/cost-log.jsonl
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ inputs.model }}-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
