# Safety net (two tiers, per codex review):
#  - every 2h: kill ci-* instances older than 14h (12h job ceiling + 2h grace)
#  - every 2h: kill ANY instance older than 24h
name: instance-reaper
on:
  # Schedule DISABLED until the LAMBDA_API_KEY repo secret exists: every scheduled run was
  # failing at `./lambdactl ls` on the key guard (lambdactl:22) and producing nothing but
  # red runs. Re-enable by uncommenting once AI-2955 item 3 (secrets) is done — the reaper
  # is the credit's seatbelt and MUST be back on before the first paid dispatch.
  # schedule:
  #   - cron: "0 */2 * * *"
  workflow_dispatch: {}
jobs:
  reap:
    runs-on: ubuntu-latest
    env:
      LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: ./lambdactl ls
      - run: ./lambdactl reap 14 ci-    # CI-tagged, tighter TTL
      - run: ./lambdactl reap 24        # everything, standing net
