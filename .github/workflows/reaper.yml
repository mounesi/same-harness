# Safety net (two tiers, per codex review):
#  - every 2h: kill ci-* instances older than 14h (12h job ceiling + 2h grace)
#  - every 2h: kill ANY instance older than 24h
name: instance-reaper
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}
jobs:
  reap:
    runs-on: ubuntu-latest
    env:
      LAMBDA_API_KEY: ${{ secrets.LAMBDA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: ./lambdactl ls
      - run: ./lambdactl reap 14 ci-    # CI-tagged, tighter TTL
      - run: ./lambdactl reap 24        # everything, standing net
