# The harness itself is stdlib-only; these are needed by the SWE-bench adapters for
# dataset loading and grading. Their sha256 is recorded in every run manifest as
# runtime.requirements_lock_sha256, so a dependency change is visible in the audit trail.
#
# Install on the GPU instance with:
#   pip install --require-hashes -r harness/requirements.lock   (once hashes are filled in)
#   pip install -r harness/requirements.lock                     (until then)
